name: Build and Release
# Artifacts will be released from main branch.
on:
  push:
    branches: [ "main" , "custom_metrics", "feature/spring_3"]
  workflow_dispatch:

env:
  DOCKER_REPO: "krogertechnology-docker.jfrog.io"
  DOCKER_DEV_REPO: "krogertechnology-docker-dev.jfrog.io"
  JFROG_URL: "https://krogertechnology.jfrog.io"

jobs:

  maven-build-metrics:
    name: Maven Test and Build (pos-utils-common-metrics)
    runs-on: [ ubuntu-latest ]
    container:
      image: krogertechnology-docker.jfrog.io/library/maven:3.8.5-openjdk-17
      credentials:
        username: ${{ secrets.ARTIFACTORY_IDENTITY_USER }}
        password: ${{ secrets.ARTIFACTORY_IDENTITY_TKN }}
    outputs:
      PROJECT_VERSION: ${{ steps.projectInfo.outputs.PROJECT_VERSION }}
      PROJECT_GROUP: ${{ steps.projectInfo.outputs.PROJECT_GROUP }}
      PROJECT_ARTIFACT: ${{ steps.projectInfo.outputs.PROJECT_ARTIFACT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Local Maven Repository
        if: always()
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: ${{ runner.os }}-maven-build-${{ github.run_number }}
          restore-keys: ${{ runner.os }}-maven-build

      # ---------- Inline: Download and Configure JFrog CLI ----------
      - name: Download JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4

      - name: Configure JFrog CLI
        shell: sh
        run: |
          jf config add \
            --url=${{ env.JFROG_URL }} \
            --user=${{ secrets.ARTIFACTORY_IDENTITY_USER }} \
            --password=${{ secrets.ARTIFACTORY_IDENTITY_TKN }} \
            --interactive=false artifactory

      - name: Configure JFrog CLI Maven
        shell: sh
        run: |
          jf mvn-config \
            --server-id-resolve artifactory \
            --repo-resolve-releases libs-release \
            --repo-resolve-snapshots libs-snapshot
      # --------------------------------------------------------------

      - name: Store Project Information
        id: projectInfo
        shell: sh
        run: |
          PROJECT_VERSION=$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="version"]/text()' pom.xml).${{ github.run_number }}
          PROJECT_GROUP=$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="groupId"]/text()' pom.xml)
          PROJECT_ARTIFACT=$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="artifactId"]/text()' pom.xml)

          echo "PROJECT_VERSION=${PROJECT_VERSION}"
          echo "PROJECT_GROUP=${PROJECT_GROUP}"
          echo "PROJECT_ARTIFACT=${PROJECT_ARTIFACT}"

          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> $GITHUB_OUTPUT
          echo "PROJECT_GROUP=${PROJECT_GROUP}"     >> $GITHUB_OUTPUT
          echo "PROJECT_ARTIFACT=${PROJECT_ARTIFACT}" >> $GITHUB_OUTPUT

          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> $GITHUB_ENV
          echo "PROJECT_GROUP=${PROJECT_GROUP}"     >> $GITHUB_ENV
          echo "PROJECT_ARTIFACT=${PROJECT_ARTIFACT}" >> $GITHUB_ENV

      - name: Run Maven Build
        shell: sh
        run: |
          jf mvn --batch-mode versions:set -DnewVersion=${PROJECT_VERSION}
          jf mvn \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.lf4jMavenTransferListener=warn \
            -Ddependencycheck.skip=true \
            --batch-mode clean package install \
            --build-name ${PROJECT_ARTIFACT} \
            --build-number ${PROJECT_VERSION}

      - name: Upload Jar to JFrog
        shell: sh
        run: |
          GROUP_PATH=$(echo ${PROJECT_GROUP} | sed 's/\./\//g')
          jf rt bp ${PROJECT_ARTIFACT} ${PROJECT_VERSION}
          cp pom.xml target/${PROJECT_ARTIFACT}-${PROJECT_VERSION}.pom
          cd target
          ls -la
          jf rt upload \
            "${PROJECT_ARTIFACT}-${PROJECT_VERSION}*" \
            "libs-release/${GROUP_PATH}/${PROJECT_ARTIFACT}/${PROJECT_VERSION}/"

      - name: Upload SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-metrics
          path: target/spotbugs.xml